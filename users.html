<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการผู้ใช้ | NARA2 BIG DATA</title><link rel="stylesheet" href="style.css"><style>body{background:#edf4fb}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel{background:#fff;border:1px solid #dce8f4;border-radius:18px;padding:18px;box-shadow:0 8px 24px #163b6810}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #edf2f7;text-align:left}.table select{padding:8px;border:1px solid #dbe7f2;border-radius:8px}.btn{padding:9px 12px;border:0;border-radius:10px;background:#156fe8;color:#fff;cursor:pointer}.muted{color:#6d819a;font-size:13px}.msg{margin:12px 0;color:#0a6c52}@media(max-width:760px){.table{font-size:12px}.hide-sm{display:none}}</style></head><body><div class="wrap"><div class="toolbar"><div><h1 style="margin:0">จัดการผู้ใช้งาน</h1><div class="muted">สำหรับผู้ดูแลระบบเท่านั้น</div></div><div><a class="btn" href="index.html" style="text-decoration:none">กลับ Dashboard</a> <button class="btn" onclick="signOut()">ออกจากระบบ</button></div></div><div class="panel"><div id="msg" class="msg"></div><table class="table"><thead><tr><th>ชื่อ</th><th>บทบาท</th><th class="hide-sm">โรงเรียน</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></div><script src="auth.js"></script><script>let schools=[];async function load(){const p=await requireAuth(['admin']);if(!p)return;const sr=await authFetch('/rest/v1/schools?select=id,name&order=name');schools=sr.ok?await sr.json():[];const r=await authFetch('/rest/v1/profiles?select=id,display_name,role,school_id&order=created_at');const users=r.ok?await r.json():[];rows.innerHTML=users.map(u=>`<tr><td>${u.display_name||'-'}</td><td><select id="role-${u.id}"><option value="admin" ${u.role==='admin'?'selected':''}>ผู้ดูแลระบบ</option><option value="area_staff" ${u.role==='area_staff'?'selected':''}>เจ้าหน้าที่เขตพื้นที่</option><option value="school_admin" ${u.role==='school_admin'?'selected':''}>ผู้ดูแลโรงเรียน</option><option value="viewer" ${u.role==='viewer'?'selected':''}>ผู้ใช้งานทั่วไป</option></select></td><td class="hide-sm"><select id="school-${u.id}"><option value="">ไม่ระบุ</option>${schools.map(s=>`<option value="${s.id}" ${String(u.school_id||'')===String(s.id)?'selected':''}>${s.name}</option>`).join('')}</select></td><td><button class="btn" onclick="saveUser('${u.id}')">บันทึก</button></td></tr>`).join('')}async function saveUser(id){msg.textContent='';const role=document.getElementById('role-'+id).value,schoolVal=document.getElementById('school-'+id)?.value||'';const body={role,school_id:schoolVal?Number(schoolVal):null};const r=await authFetch(`/rest/v1/profiles?id=eq.${id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});msg.textContent=r.ok?'บันทึกสิทธิ์เรียบร้อย':'บันทึกไม่สำเร็จ'}load();</script></body></html>
